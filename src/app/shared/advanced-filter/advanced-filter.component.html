<div class="container mt-1">
  <div class="card" style="height: 23vw">
    <div class="card-header bg-primary text-white" style="padding: 7px;">
      <h5 class="mb-0">Advanced Filter</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="filterForm">
        <div class="row">
          <div *ngFor="let field of filterFields" class="col-md-4 mb-0">
            <div class="form-group">
              <!-- &lt;!&ndash; Text Input &ndash;&gt;
               <input *ngIf="field.type === 'text'"
              matInput
              [formControlName]="field.key"
              type="text"
              [placeholder]="field.label"> &ndash;&gt;
              Material Dropdown with Search -->
              <mat-form-field *ngIf="field.type === 'dropdown'" class="full-width" appearance="outline">
                <mat-label>{{ field.label }}</mat-label>
                <mat-select [formControlName]="field.key">
                  <mat-option>
                    <ngx-mat-select-search [formControl]="searchFilter"
                                           [noEntriesFoundLabel]="'Nothing to display'"
                                           [placeholderLabel]="'Search'">
                      <i class="material-icons dlticon" ngxMatSelectSearchClear>delete_outline</i>
                    </ngx-mat-select-search>
                  </mat-option>
                  <mat-option [value]="0">None</mat-option>
                  <mat-option *ngFor="let option of field.options" [value]="option.value">
                    {{ option.label }}
                  </mat-option>
                </mat-select>
              </mat-form-field>

              <!-- Date Picker -->
              <!--<mat-form-field *ngIf="field.type === 'date'" class="full-width" appearance="outline">
                <mat-label>{{ field.label }}</mat-label>
                <input matInput [formControlName]="field.key" type="date">
              </mat-form-field>

               Checkbox -->
              <!--<mat-checkbox *ngIf="field.type === 'checkbox'" [formControlName]="field.key">
                {{ field.label }}
              </mat-checkbox>-->

            </div>
          </div>

          <div class="d-flex justify-content-end">
            <button class="btn btn-primary me-1" (click)="applyFilters()">Apply filter</button>
            <button class="btn btn-light" (click)="resetFilters()">Clear filter</button>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>
