<div class="container">
  <div class="d-flex justify-content-between" >
    <div class="p-1">
      <label class="head">Bypass Requests</label>
    </div>
    <div class="p-2">
      <span (click)="close()">
        <mat-icon>close</mat-icon>
      </span>
    </div>
  </div>
  <mat-divider></mat-divider>
  <div class="spacer"></div>
  <div class="container-fluid card" style="padding: 10px;margin-bottom: 10px">

    <!-- Scrollable Container for Warnings -->
    <div class="scroll-container" *ngIf="hasBypassData">
      <!-- Loop to Render Rows Without Table -->
      <div *ngFor="let item of filteredBypassData" class="error-row">
        <div class="d-flex align-items-center">
          <strong style="padding: 15px"> ⚠️</strong>
          <div class="row-content">
            <p style="color:red" [innerHTML]="item.errorMessage"></p>
            <p><strong>Parent SKU:</strong> {{ item.parentItem }}</p>
            <p><strong>Child SKU:</strong> {{ item.childItem }}</p>
            <p><strong>Depot:</strong> {{ item.depot }}</p>
            <p><strong>Channel:</strong> {{ item.channel }}</p>
          </div>
        </div>
      </div>
    </div>

    <div style="height: 10px;"></div>

    <div class="d-flex">
      <p class="pHeader">{{message}}</p>
    </div>
    <div class="d-flex">
    <textarea name="" cols="30" rows="10" style="width: 99%; height: 70px;" maxlength="500"placeholder="Enter remarks..." [(ngModel)]="remarks" (input)="validateRemarks($event)"></textarea>
    </div>
    <small class="text-muted counter">{{ remarks ? 500 - remarks.length : 0 }} characters left</small>

    <div class="d-flex justify-content-end p-1" style="margin-right: -25px;">
      <div class="p-1">
        <button mat-stroked-button color="info" (click)="close()"><mat-icon>close</mat-icon>Close</button>
      </div>
      <div class="p-1" *ngIf="!hideBtn">
        <button mat-stroked-button color="warn"(click)="RejectOrCancelRequest()" >Reject Request</button>
      </div>
      <div class="p-1" *ngIf="hideBtn">
        <button mat-stroked-button color="warn"(click)="RejectOrCancelRequest()" >Cancel Request</button>
      </div>
    </div>
  </div>
</div>
