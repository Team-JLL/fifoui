<div class container>
  <div class="row">
    <div class="col-md-12">
      <img src="assets/dashboard.png" alt="" style="height: 20px;padding-left: 10px;margin-bottom: 10px">
      <label class="form-header-2">Repository</label>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 ">
      <mat-divider></mat-divider>
    </div>
  </div>
  <div style="height:10px"></div>

  <div class="card">
    <div class="card-body" >
      <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap">
            <div class="sb-example-repository w-100">
              <div class="search d-flex align-items-center">
                <input type="text" class="form-control searchTerm flex-grow-1" placeholder="Search here..." (keypress)="omit_special_char($event)" [(ngModel)]="search" (input)="globalSearch(search)">
                <button class="btn btn-secondary btn-sm ml-1" (click)="downloadRepositoryReport()" title="Excel report" style="height: 35px">
                  <i class="fa fa-download"></i> Repository Report
                </button>
              </div>
            </div>
      </div>

      <div class="d-flex justify-content-between">
        <ag-grid-angular
          style="width: 100%; height: 550px; text-align: center"
          class="ag-theme-balham"
          [rowHeight]="25"
          [paginationAutoPageSize]="true"
          [paginationPageSize]="20"
          [headerHeight]="35"
          [scrollbarWidth]="2"
          rowSelection="multiple"
          [pagination]="true"
          (gridReady)="onGridReady($event)"
          [columnDefs]="columnDefs"
          [defaultColDef]="defaultColDef"
          (cellClicked)="cellClickEvent($event)"
          [filterable]="true" [showfilterrow]="true"
          [rowData]="rowData">
        </ag-grid-angular>
    </div>

    </div>
  </div>

  </div>
